name: 'AuditBind SOC 2 Evidence'
description: 'Evaluate pull requests for SOC 2 controls, generate tamper-evident evidence, and report results to AuditBind.'
author: 'StackSecure Labs'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token used to read pull-request metadata and optionally post comments.'
    required: false
    default: ${{ github.token }}
  required_approvals:
    description: 'Minimum number of approving reviews required for CC8.1.'
    required: false
    default: '1'
  stale_approval_days:
    description: 'Approvals older than this number of days are considered stale.'
    required: false
    default: '30'
  fail_on_critical:
    description: 'Fail the workflow when a critical control finding is detected.'
    required: false
    default: 'true'
  comment_on_pr:
    description: 'Create or update an AuditBind summary comment on the pull request.'
    required: false
    default: 'true'
  llm_api_key:
    description: 'Optional customer-provided LLM API key for enhanced CC7.1 and CC7.2 analysis.'
    required: false
    default: ''
  llm_provider:
    description: 'LLM provider: auto, openai, anthropic, google, xai, deepseek, moonshot, zhipu, or groq.'
    required: false
    default: 'auto'
  llm_model:
    description: 'Model used for optional LLM analysis.'
    required: false
    default: 'gpt-4o-mini'
  llm_base_url:
    description: 'Optional custom OpenAI-compatible API endpoint.'
    required: false
    default: ''
  auditbind_api_key:
    description: 'AuditBind dashboard API key. When omitted, upload is skipped and evidence remains local.'
    required: false
    default: ''
  auditbind_api_url:
    description: 'AuditBind API base URL.'
    required: false
    default: 'https://api.auditbind.io'
  output_dir:
    description: 'Directory where AuditBind writes the JSON evidence artifact.'
    required: false
    default: './evidence'

outputs:
  verdict:
    description: 'Overall verdict: PASS, FAIL, NOT_APPLICABLE, or ERROR.'
  artifact_path:
    description: 'Path to the generated evidence JSON file.'
  artifact_hash:
    description: 'SHA-256 hash of the generated evidence artifact.'
  findings_count:
    description: 'Findings reported by the primary change-management evaluation.'
  dashboard_url:
    description: 'Dashboard URL returned after a successful evidence upload.'

runs:
  using: 'node24'
  main: 'dist/index.js'
